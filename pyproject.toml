[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "strands-agent-app"
version = "0.1.0"
description = "Generic Python Strands-style agent that fetches Amazon.in customer feedback and summarizes it using Gemini."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31.0",
  "beautifulsoup4>=4.13.0",
  "python-dotenv>=1.0.0",
  "fpdf>=2.5.0"
]

[tool.setuptools]
packages = ["strands_agent_app"]
package-dir = {"" = "src"}
